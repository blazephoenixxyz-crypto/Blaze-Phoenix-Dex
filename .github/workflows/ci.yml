name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: default

jobs:
  test:
    name: build + test (fast profile)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Secret and private-address guard (public is not a state you can take back)
        # Runs before every other gate, needs no compiler, and takes a second.
        # A credential, a private runner address or a personal mail domain in the
        # tree cannot be undone by a later commit: it stays in the history and in
        # every clone. Address and token for the verification runner are operator
        # configuration read from the environment (see .github/scripts/mcdc.py);
        # anything genuinely publishable is declared in that script's ALLOW list
        # with a written reason.
        run: python3 .github/scripts/check_no_secrets.py

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show versions
        run: forge --version

      - name: Shared-quantity register (a pin that does not name what it pins is a hole with a green test in front of it)
        # SHARED_QUANTITIES.md enumera toda a grandeza com mais de um produtor ou
        # consumidor, e diz o que a prende. Esta guarda verifica que a linha nao
        # mente: um `PINNED` tem de citar um teste que EXISTE e que NOMEIA a
        # grandeza. Nao tenta descobrir grandezas partilhadas novas — decidir que
        # dois consumidores fazem a MESMA pergunta e trabalho humano.
        #
        # A regra 2 nao e teorica: no dia em que o registo foi escrito despromoveu
        # duas linhas. O `PreviewExecutionParity` diz pinar o PROTOCOL_FEE_BPS e
        # nunca o nomeia (compara netOut com 0,1% de tolerancia, e o regime de
        # exaustao escapa-lhe — FEE-01); o `DepthUnitParity` exercita o
        # `depthFromL` quando os quatro produtores vivos chamam o `depthFromL18`,
        # que e onde vive a normalizacao de decimais e por onde ja escapou um
        # defeito. Sete dos achados verificados de 2026-08-23 foram desta classe:
        # duas fontes da mesma grandeza sem nada a obriga-las a concordar.
        run: bash .github/scripts/shared-quantities.sh

      - name: Yul evaluation-order guard
        # Yul evaluates a builtin's arguments RIGHT TO LEFT, so
        # `and(staticcall(...), eq(returndatasize(), 32))` tests the size left
        # by the PREVIOUS external call, not by this one. That shipped once
        # (Core._curveCryptoGetDy) and cost us a silently inert protocol floor;
        # the fix is the ok-variable idiom the rest of the codebase already
        # uses. A comment asking people not to "simplify" it back is a plea —
        # this is the rule. Costs ~2s and no compiler. The comment filter is
        # required: the warning comment itself contains the literal pattern.
        run: |
          if grep -rnE 'and\((staticcall|call|delegatecall|callcode)\(' src/ | grep -vE ':\s*(///|//|\*)'; then
            echo "::error::Yul builtin arguments evaluate right-to-left: capture the call result in a variable first, then test returndatasize()."
            exit 1
          fi

      - name: V4 hook-sieve census (assumption A4 - one unlock, behind the sieve)
        # A4 of the assumption book: every executed V4 swap passes the hook-delta
        # refusal (RouterE(9)) before the PoolManager is unlocked. The review of
        # 2026-09-02 read it true - exactly ONE `unlock` call site in the Router,
        # inside _execV4Amt, after the sieve - and found that NOTHING enforced it:
        # a second call site could appear and route a V4 swap around the sieve
        # in silence. This pins the count. The sieve itself is exercised by the
        # RouterE(9) tests and its mutant lives in mutants.py.
        run: |
          N=$(grep -cE '\)\.unlock\(' src/BlazePhoenixRouter.sol)
          if [ "$N" -ne 1 ]; then
            echo "::error::A4: expected exactly one PoolManager.unlock call site in the Router, found $N. Every V4 execution path must pass the hook sieve before unlock."
            exit 1
          fi

      - name: Depth unit guard (L cru nunca vira depthWad)
        # `depthWad` tem de ser TOKEN-denominado para ser comparavel entre familias de venue:
        # o V2 reporta min(r0,r1), unidades lineares. L esta em escala-RAIZ, logo entrega-lo cru
        # faz uma pool concentrada ancorar acima de uma V2 igualmente funda por ~sqrt(preco).
        # Isto ja foi corrigido TRES vezes em sitios diferentes (universalQuote V3, universalQuote
        # V4, Hub.claimV4) e mesmo assim faltava num QUARTO (Router._recordHits), que corre em
        # todos os swaps executados e reescrevia o bucket que o claimV4 tinha gravado certo.
        # A conversao vive agora numa unica primitiva, `BPC.depthFromL`. Esta guarda existe para
        # que nao apareca um quinto irmao: nenhum produtor de profundidade pode atribuir liquidez
        # crua. O corpo da propria primitiva devolve `uint256(liq)` no caso sp == 0, e por isso e
        # um `return`, nao uma atribuicao — fica de fora do padrao por construcao.
        run: |
          if grep -rnE '(depth|depthWad|depthTok)[[:space:]]*=[[:space:]]*uint256\((liq|BPC\.getLiquidity|getLiquidity)' src/ | grep -vE ':\s*(///|//|\*)'; then
            echo "::error::Liquidez crua atribuida a uma variavel de profundidade. L e escala-raiz; usa BPC.depthFromL(liq, sqrtPriceX96) para obter unidades de token."
            exit 1
          fi

      - name: Depth producer guard (profundidade nunca vem de calldata)
        # depthWad alimenta _canInsert (Hub) e o bucket do Monoslot, que alimenta o psi que o
        # Solver usa para ranquear. Se um produtor grava um numero que o chamador escolheu, o
        # chamador passa a decidir o ranking do registo — e o ramo curve-like faz exatamente isso
        # hoje (Router:1498, `depth = leg.expectedOut`). O produtor tem de gravar o `got` MEDIDO.
        # Complementa a guarda de unidades ja existente (L cru), que cobre a outra metade da mesma
        # classe: uma e "unidade errada", esta e "fonte errada".
        run: |
          if grep -rnE '(depth|depthWad|depthTok)[[:space:]]*=[[:space:]]*leg\.expectedOut' src/ | grep -vE ':\s*(///|//|\*)'; then
            echo "::error::Profundidade do registo gravada a partir de calldata (leg.expectedOut). Usa o valor MEDIDO (delta de balanceOf) — quem submete a rota nao pode escolher o seu proprio ranking."
            exit 1
          fi

      - name: Fee fallback guard (calldata nao substitui uma medicao falhada)
        # I-measure: quando a leitura viva da fee falha, cair para a fee de CALLDATA e' deixar o
        # chamador escolher o numero que alimenta impactV3Bps -> avgImpact -> ironFloorBps ->
        # protocolFloorOut. Ou seja: a calldata acaba a definir o piso do PROTOCOLO.
        # O padrao proibido e' o FALLBACK (`... ? ... : leg.fee`) dentro de uma chamada out*/impact*.
        # ISENTO por construcao: `effV4Fee(leg.fee, ...)`. No V4 o leg.fee entra no
        # computeV4PoolId, logo uma fee mentirosa produz um pid diferente que nao casa com pool
        # viva (sp == 0) e falha fechado — esta autenticado, nao confiado.
        run: |
          if grep -rnE '(out|impact)[A-Za-z0-9]*\([^;]*:[[:space:]]*leg\.fee' src/ | grep -vE ':\s*(///|//|\*)'; then
            echo "::error::Fee de calldata usada como fallback de uma leitura viva falhada. Fail-closed em vez de cair para leg.fee — senao o chamador define o piso do protocolo."
            exit 1
          fi

      - name: Fee producer guard (um so juizo por pergunta de fee)
        # DUAS perguntas de fee, dois produtores unicos no Core, e ZERO copias fora dele.
        #
        # 1. "que fee cobra uma pool V2 que nao a declara?" -> BPC.effV2Fee. O literal `== 0 ? 30`
        #    estava escrito a mao em TRES sitios: o caminho da COTACAO do Router, o da EXECUCAO do
        #    Router, e o universalQuote. Os dois primeiros sao o par que TEM de concordar — se
        #    divergirem, a cotacao mente sobre o que a execucao vai fazer, que e a forma exata das
        #    fugas de fee ja fechadas nesta base.
        #    DESDE 2026-08-25 o produtor tambem poe um TECTO (V2_FEE_CEILING_BPS = 100): um par V2
        #    nao tem `fee()` para desmentir a calldata, e uma fee declarada de 99% deflacionava o
        #    quote para ~1% e com ele o protocolFloorOut. Como AMBOS os lados do par-que-tem-de-
        #    concordar chamam este produtor, o tecto mantem-nos byte-a-byte iguais.
        #
        # 2. "qual e a fee VIVA desta pool concentrada?" -> BPC.quoteV3Fee. O Router tinha uma copia
        #    que divergia no caso que o Core documenta em voz alta ("0% is legal"): fazia
        #    `dynFee != 0 ? dynFee : 0xFFFFFF`, tratando um 0% MEDIDO COM SUCESSO como falha. Uma
        #    pool Algebra de fee 0% era cotada a zero e caia fora do routing. O
        #    test_ZeroDynamicFeeStillQuotes existia e passava — pelo OUTRO canal.
        #
        # A distincao que a copia perdia: o `dyn` de v3StateAndDynFee e uma flag de SUCESSO DE
        # LEITURA, enquanto o getV3Fee devolve 0 tanto para "falhou" como para "e mesmo zero".
        # So o segundo pode fechar sobre um zero.
        run: |
          if grep -rnE '==[[:space:]]*0[[:space:]]*\?[[:space:]]*30([^0-9]|$)' src/ \
             | grep -vE 'declared == 0 \|\| declared > V2_FEE_CEILING_BPS' | grep -vE ':\s*(///|//|\*)'; then
            echo "::error::Default de fee V2 escrito a mao. Usa BPC.effV2Fee — tres copias de um literal e a assinatura de defeito da casa."
            exit 1
          fi
          if grep -rnE '\?[^;]*:[[:space:]]*0xFFFFFF' src/ \
             | grep -vE 'src/BlazePhoenixCore\.sol' | grep -vE ':\s*(///|//|\*)'; then
            echo "::error::Juizo de fee viva fora do Core. Usa BPC.quoteV3Fee — a copia divergia sobre se um 0% medido e legal."
            exit 1
          fi

      - name: Producer copy guard (one producer per registry answer)
        # SHARED_QUANTITIES.md rows collapsed to SINGLE on 2026-09-02, each with the copy
        # that used to disagree with the producer:
        #   * "is this pair anchored on a routable bridge?" -> Hub._pairBridged, read live.
        #     The copy was a bit frozen into the Monoslot at registration (_isBridged /
        #     _markBridged): removeBridge cleared the mapping and never walked the pools.
        #   * "is this a stable-curve pool?" -> the pool's own stable(), persisted in
        #     Monoslot bit 5 by Core.solidlyStable at registration. The copy was the
        #     literal `p.stable = false` in _readPoolInfo, a constant standing in for a
        #     field the slot did not have.
        run: |
          if grep -nE '_isBridged|_markBridged' src/BlazePhoenixHub.sol | grep -vE ':\s*(///|//|\*)'; then
            echo "::error::The bridge answer is read live by Hub._pairBridged. A frozen copy of it in the Monoslot is the BRIDGE-01 defect."
            exit 1
          fi
          if grep -nE 'p\.stable[[:space:]]*=[[:space:]]*false' src/BlazePhoenixHub.sol | grep -vE ':\s*(///|//|\*)'; then
            echo "::error::The registry's stable flag comes from Monoslot bit 5 (the pool's own stable() at registration). A constant here is the SLOT-01 defect."
            exit 1
          fi

      - name: Router grants no allowance (guarda de propriedade, nao de bug)
        # O HUNT-001 (achado #1 da caca overnight) vivia em _execCurveAmt, que e o UNICO sitio de
        # todo o Router/Hub/Solver que concede uma allowance — Router:1241 (forceApprove) e
        # Router:1282 (safeApprove). Quando o Curve sair, a vulnerabilidade morre COM o alvo, e os
        # 3 testes de test/hunt/ResidualApproval.t.sol morrem com ela.
        # O PERIGO NAO E O CORTE — e o que se perde no corte: hoje "o Router nao deixa allowances
        # de pe" e um FACTO TESTADO; sem esta guarda passa a ser um ACIDENTE de ninguem chamar
        # approve. O primeiro integrador que reintroduzir um approve (um adaptador, um permit2 de
        # saida) recupera a vulnerabilidade sem ninguem ficar vermelho.
        # A propriedade fica assim MAIS forte do que antes do corte: de "esta allowance e segura"
        # para "nao existem allowances". As primitivas em BlazePhoenixCore (L440/L459) FICAM — sao
        # a biblioteca; o que se proibe e o Router chama-las.
        run: |
          if grep -nE '(forceApprove|safeApprove|\.approve\()' src/BlazePhoenixRouter.sol | grep -vE ':\s*(///|//|\*)'; then
            echo "::error::O Router nao pode conceder allowances. Se precisas mesmo de uma, o padrao seguro esta em _execCurveAmt no historico do git — e le antes o test/hunt/ResidualApproval.t.sol para saber o que ela custa."
            exit 1
          fi

      - name: Curve/Balancer excisado (decisao do dono 2026-08-20)
        # Removidos por decisao: quase nenhuma L2 os tem, e custavam bytecode em cinco contratos.
        # O corte apaga tres superficies que eram cada uma a UNICA da sua classe: o unico approve
        # do Router (acima), o unico produtor de depthWad atestado pelo caller (o ramo curve-like
        # de _recordHits) e o unico buraco deliberado na prova de autenticidade do Hub (a mascara
        # 0x6b exclui os kinds 2 e 7 — para esses a pool NAO e verificada E a profundidade e
        # atestada). As constantes KIND_STABLE=2, KIND_BALANCER_V2=3 e KIND_CURVE=7 FICAM como
        # lapides: decodeKind le o kind dos bits do Monoslot, e renumerar reinterpretaria slots
        # ja gravados. Esta guarda proibe o CODIGO, nao os numeros.
        run: |
          if grep -rnE '(curveGetDy|curveResolveIndices|_curveCryptoGetDy|_execCurveAmt|_scanCurve|find_pool_for_coins)' src/ | grep -vE ':\s*(///|//|\*)'; then
            echo "::error::Simbolo Curve/Balancer em src/. Foram excisados por decisao do dono; os numeros de kind ficam reservados como lapides, o codigo nao volta."
            exit 1
          fi

      - name: Build
        run: forge build

      - name: Test
        # Fork tests (test/fork/**) require a dedicated archive RPC; on the
        # shared CI they hit public-endpoint rate limits (HTTP 429) and fail
        # non-deterministically. Exclude them from the fast profile — run them
        # separately with an RPC secret. This keeps the fast run hermetic.
        run: forge test -vvv --no-match-path "test/fork/**"

      - name: Mutant target check (a guard nobody watches any more)
        # Runs BEFORE the mutation guard, needs no compiler, and takes a second.
        # It answers one question: does every mutant still point at a line that
        # exists, exactly once?
        #
        # WHY IT IS SEPARATE. On 2026-09-03 a rename inside _assembleRouteMulti
        # (totalImpactBps -> gateImpactBps) orphaned two pre-existing mutants and
        # nothing noticed, because the session that made the rename ran only the
        # SUBSET of mutants it had just added. A subset run cannot see a lost
        # target in an entry it does not run. The full guard below does catch it,
        # but it costs a compile per mutant and it is the last thing to run; this
        # check is the one to run locally after ANY edit to src/.
        run: python3 .github/scripts/check_targets.py

      - name: Mutation guard (os guardas tem de ter testes que os apanhem)
        # PORQUE ISTO GATEIA. Nesta base de codigo, DUAS vezes documentadas, um fix vivo ficou
        # com testes mortos: a suite passava na mesma com o fix REMOVIDO. O caso mais recente
        # passou 5/5 com o portao de cobertura arrancado — o revert que o teste apanhava vinha
        # de OUTRA verificacao com o MESMO codigo de erro. Uma suite verde nao prova nada sobre
        # um guarda especifico; so a mutacao o prova.
        #
        # NAO e uma ferramenta de mutacao generica, de proposito: e uma lista FIXA e VERSIONADA
        # de mutantes, cada um emparelhado com o teste nomeado que TEM de o apanhar. Corre em
        # segundos e falha de forma legivel, dizendo qual guarda ficou sem vigia.
        #
        # O CONTRATO: acrescentar um guarda de seguranca ao protocolo implica acrescentar a sua
        # linha em .github/scripts/mutants.py. Se o alvo de um mutante deixar de existir, o job
        # falha — e isso e desejado: significa que o codigo mudou por baixo de uma verificacao.
        run: python3 .github/scripts/mutants.py

      - name: Deeper invariant/fuzz pass (REPORT-ONLY — never gates)
        # `|| true` is deliberate: this deep campaign is a search, not a bound,
        # and its variance would make the gating job flaky. Labelled so nobody
        # reads a green tick here as a proof — the gate is the hermetic run
        # above plus the Halmos specs. If one of these ever starts discharging
        # deterministically, promote it into the gate and drop the `|| true`.
        # The glob was "test/*Invariant*", which is case-sensitive: it matched 13 of 33
        # invariants and MISSED the two that matter most - BlazePhoenixRouter.invariant.t.sol
        # (the fee campaign) and FullStackLoop.invariant.t.sol - both spelled with a lower-case
        # i. 20 of 33 were never run deeper than 50x50 anywhere. Dropping the first letter
        # matches both spellings.
        run: forge test --match-path "test/*nvariant*" --fuzz-runs 512 --invariant-runs 128 --invariant-depth 128 -vv || true

  fork-tests:
    name: fork tests (archive RPC)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Fork tests
        # dRPC (no rate limit, all 5 chains) forks directly - no Anvil, no
        # throttling. The DRPC_KEY secret feeds foundry.toml's [rpc_endpoints]
        # via ${DRPC_KEY}; never hard-coded.
        env:
          DRPC_KEY: ${{ secrets.DRPC_KEY }}
        # Retried, because the observed failures are third-party RPC timeouts
        # ("operation timed out" from lb.drpc.live), not verdicts about our code
        # — the same commit passed and failed on consecutive runs. Retrying
        # collapses failures that are independent between attempts; it does
        # nothing for a real one, which fails all three deterministically. So
        # this cuts the false-red rate without weakening the signal at all.
        run: |
          set -o pipefail
          SPEC="RpcProbeTest|BaseForkTest|BaseTop100Test|CurveExcisionRegistration|OptimismProbeTest|ArbitrumProbeTest|RobinhoodProbeTest|BaseV4ProbeTest|V4DynamicDiscoveryTest|RobinhoodV4DiscoveryTest|RobinhoodV4SweepTest|RobinhoodV4DeriveTest|RobinhoodV4NativeTest|FidelityMatrixBaseTest|FidelityMatrixArbitrumTest|FidelityMatrixOptimismTest|FidelityMatrixRobinhoodTest|TokenSweepBaseChainTest|TokenSweepArbitrumTest|TokenSweepOptimismTest|MetricsSweepBaseTest|DiscoveryColdWarmTest|QuoteExecDivergenceTest|FactoryWorthBaseTest|ReproClFeeSentinelBase|DeployedCodehashPinTest|DeployedParityTest|IsoladaExecucaoCL|IsoladaExecucaoV4Nativa|IsoladaExecucaoSolidlyV1"
          for attempt in 1 2 3; do
            if forge test -vvv --match-path "test/fork/**" --match-contract "$SPEC" 2>&1 | tee fork.log; then
              # Exit code 0 is NOT a verdict here: every fork setUp `vm.skip`s
              # when DRPC_KEY is empty, so a missing or rotated secret would
              # turn this lane green with ZERO tests run. Only a positive
              # count is green (the house rule: "0 failed" on nothing proves
              # nothing; "N passed" does).
              PASSED=$(grep -oE '[0-9]+ tests passed' fork.log | tail -n1 | grep -oE '^[0-9]+' || echo 0)
              if [ "${PASSED:-0}" -gt 0 ]; then exit 0; fi
              echo "::error::fork lane finished with ${PASSED:-0} tests passed — the secret is missing or every suite skipped; this is not green"
              exit 1
            fi
            echo "::warning::fork attempt $attempt failed — retrying in 20s (dRPC timeouts are the usual cause)"
            sleep 20
          done
          echo "::error::fork tests failed three consecutive attempts — treat this as real, not as a flake"
          exit 1

  size-guard:
    name: EIP-170 size guard (release profile)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Release build with sizes
        id: sizes
        env:
          FOUNDRY_PROFILE: release
        run: |
          set -o pipefail
          forge build --sizes | tee sizes.txt

      - name: Enforce EIP-170 with margin (< 24000 bytes runtime)
        env:
          FOUNDRY_PROFILE: release
        run: |
          # Fail if any BlazePhoenix* contract's deployed/runtime size >= 24000 bytes.
          # EIP-170 hard limit is 24576; we require a safety margin.
          python3 - <<'PY'
          import re, sys
          limit = 24000
          bad = []
          rows = []
          with open("sizes.txt") as f:
              for line in f:
                  # Anchor to real forge --sizes rows: | BlazePhoenixX | runtime | ...
                  # This ignores warning/path/snippet lines (which never start with
                  # "| BlazePhoenix") and reads exactly the runtime-size column,
                  # never the initcode or margin columns. A bare "|  |" cell cannot
                  # match (\d[\d,]* requires a leading digit), so int("") never fires.
                  m = re.match(r"^\s*\|\s*(BlazePhoenix\w*)\s*\|\s*(\d[\d,]*)\s*\|", line)
                  if not m:
                      continue
                  name = m.group(1)
                  if name.endswith(("Test", "Script")):
                      continue          # undeployed harnesses never hit EIP-170
                  runtime = int(m.group(2).replace(",", ""))
                  rows.append((name, runtime))
                  if runtime >= limit:
                      bad.append((name, runtime))
          print("Runtime sizes (bytes):")
          for n, r in rows:
              print(f"  {n:32s} {r:6d}  ({limit - r:+d} to margin, {24576 - r:+d} to hard limit)")
          if bad:
              print("\nEIP-170 MARGIN VIOLATION:")
              for n, r in bad:
                  print(f"  {n} = {r} bytes >= {limit}")
              sys.exit(1)
          warn = [(n, r) for n, r in rows if r >= 23000]
          if warn:
              print("\nSOFT-WARN (>= 23000, approaching the margin — arm C5):")
              for n, r in warn:
                  print(f"  {n} = {r} bytes")
          expected = {"BlazePhoenixCore", "BlazePhoenixHub", "BlazePhoenixQuoter",
                      "BlazePhoenixRouter", "BlazePhoenixSolver"}
          missing = expected - {n for n, _ in rows}
          if missing:
              print(f"\nGUARD ERROR: deployed contracts missing from sizes.txt: {sorted(missing)}")
              sys.exit(1)
          print("\nAll BlazePhoenix contracts under the 24000-byte margin. OK.")
          PY

      - name: Record release artifact hashes (deploy provenance)
        env:
          FOUNDRY_PROFILE: release
        run: |
          # sha256 of each deployed (runtime) bytecode from THIS release build.
          # The recorded hash is what a post-deploy `cast code | sha256sum` on
          # chain must reproduce — pinning the audited artifact to the deploy.
          set -euo pipefail
          {
            echo "# release artifact hashes — commit ${GITHUB_SHA}"
            for c in BlazePhoenixCore BlazePhoenixHub BlazePhoenixQuoter BlazePhoenixRouter BlazePhoenixSolver; do
              f="out/${c}.sol/${c}.json"
              test -f "$f" || { echo "MISSING ARTIFACT: $f"; exit 1; }
              h=$(jq -r '.deployedBytecode.object' "$f" | sha256sum | cut -d' ' -f1)
              echo "${c}: sha256=${h}"
            done
          } | tee release-hashes.txt

      - uses: actions/upload-artifact@v7
        with:
          name: release-hashes
          path: release-hashes.txt

  formal:
    name: formal verification (Halmos symbolic)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install Halmos
        run: pip install halmos

      - name: Symbolic PROOF — Core math hard gate (iron floor / impact / V3 fail-closed)
        # test/formal/CoreFormalGateSpec.t.sol. Checks land in this contract
        # only after a report-only CI run MEASURED them discharging cleanly
        # (0.04–0.19s each, run 31532581231): iron-floor bounds unconditional
        # (INV-1's arithmetic heart), impactV2Bps <= BPS, outV3 fail-closed on
        # degenerate inputs. REAL gate — no `|| true`.
        run: halmos --contract CoreFormalGateSpec -v

      - name: Symbolic PROOF — INV-20 effV4Fee fail-closed (hard gate)
        # test/formal/EffV4FeeFormalSpec.t.sol. Pure comparison logic, no 512-bit
        # mulDiv over-approximation — Halmos discharges it cleanly, so this is a
        # REAL gate (no `|| true`): the dynamic-fee sentinel can never survive as
        # a usable fee and a non-zero protocolFee always fails closed to >=1e6.
        # Keyless: this is the free-prover equivalent of the Certora scaffold.
        #
        # MOVED AHEAD of the report-only step, and the reason matters: the
        # report-only checks below TIMEOUT at 60-189s each, which consumed the
        # job's 30-minute budget and got the runner shut down mid-step. `|| true`
        # guards against a non-zero exit, not against exhausting the clock — so
        # this proof was never reaching the runner at all. We believed we had two
        # hard gates and were running one.
        run: halmos --contract EffV4FeeFormalSpec -v

      # A SECOND SYMBOLIC ENGINE BELONGS HERE, AND IS NOT WIRED YET.
      # hevm was added beside Halmos on these same specs and removed in the same
      # session: it installed and ran, and answered `Usage: hevm COMMAND` — the
      # invocation was wrong, not a proof disagreeing. Rather than leave a step
      # that fails on configuration (a red gate that teaches nobody) or wrap it
      # in `|| true` (a green gate that lies, which is exactly how the Aderyn job
      # spent weeks reporting success without running), it comes out until the
      # command line has been exercised against the real CLI.
      #
      # The case for adding it stands: hevm and Halmos both execute existing
      # Foundry specs symbolically, so they are interchangeable on these
      # contracts and the second engine costs one step, not a second body of
      # work. Different implementations mean agreement is evidence and
      # disagreement is a question worth answering.
      #
      # Considered and rejected: Kontrol treats every revert as a test failure,
      # and in a codebase where failing closed IS the design that manufactures
      # false positives faster than it finds defects.

  gas-metrics:
    name: gas metrics (offline ledger)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Measure gas ledger (offline harness, reporting-only)
        # Not a pass/fail correctness gate - surfaces the MEASURED gas ledger
        # (cold-vs-warm discovery, security-architecture overhead, registry
        # feedback, SSTORE2/CREATE2 levers) into a small dedicated log so gas
        # regressions are visible per-commit and the warm/cold numbers stay
        # current instead of being trusted from a stale one-off measurement.
        run: forge test --match-contract "LifecycleMetrics|SecurityArchitectureGas|Sstore2RegistryGas|DiscoveryModeGas" -vv
