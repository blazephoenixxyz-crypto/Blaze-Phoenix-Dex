name: security

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Brutal static + detector layer, complementing the formal jobs in ci.yml
# (Halmos symbolic + SMTChecker CHC). Cloud-only — never run on the maintainer's
# device. Slither gates on high-impact/high-confidence findings; Aderyn and
# Solhint are report-only (uploaded as artifacts) so they surface issues without
# blocking on style/informational noise.

jobs:
  slither:
    name: Slither (static detectors, fail on high)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Slither
        run: pip install slither-analyzer
      - name: Slither — full detectors, SARIF + markdown summary
        run: |
          slither . \
            --sarif slither.sarif \
            --checklist --markdown-root . > slither-report.md 2>&1 || true
          echo "----- Slither summary -----"
          tail -c 40000 slither-report.md || true
      - name: Slither — GATE on high-impact/high-confidence
        # Fails the job if any high-impact & high-confidence detector fires.
        run: slither . --fail-high
      - name: Upload Slither reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: slither-reports
          path: |
            slither.sarif
            slither-report.md

  aderyn:
    name: Aderyn (static analyzer, GATE on high)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      # THIS JOB REPORTED SUCCESS FOR WEEKS WITHOUT ANALYSING A LINE.
      # The old install piped Cyfrin's script into bash with `|| true`, then
      # invoked `~/.cyfrin/bin/aderyn` — a path that did not exist — with every
      # command trailing `|| true`. The log said `command not found`, the step
      # exited 0, and the badge went green. That is the exact failure this
      # project names a NOMINAL GATE: a check that blocks only what the platform
      # forces it to block. Install from the release binary, verify the binary
      # answers before trusting it, and let a real finding fail the build.
      - name: Install Aderyn (verified)
        run: |
          set -euo pipefail
          # Install from the release archive directly. The `cyfrinup` bootstrap
          # is a moving target and was the reason this job spent weeks reporting
          # success without an analyser: it failed, `|| true` swallowed it, and
          # the missing binary was never noticed.
          VER=$(curl -fsSL https://api.github.com/repos/Cyfrin/aderyn/releases/latest | grep -m1 '"tag_name"' | cut -d'"' -f4)
          curl -fsSL "https://github.com/Cyfrin/aderyn/releases/download/${VER}/aderyn-x86_64-unknown-linux-gnu.tar.xz" -o "$RUNNER_TEMP/aderyn.tar.xz"
          mkdir -p "$HOME/bin" "$RUNNER_TEMP/aderyn"
          tar -xJf "$RUNNER_TEMP/aderyn.tar.xz" -C "$RUNNER_TEMP/aderyn"
          install -m755 "$(find "$RUNNER_TEMP/aderyn" -maxdepth 3 -name aderyn -type f | head -1)" "$HOME/bin/aderyn"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/aderyn" --version   # fails the job if the binary is not really there

      - name: Aderyn — full report
        run: |
          set -euo pipefail
          aderyn . -o aderyn-report.md
          echo "----- Aderyn summary -----"
          grep -E '^##|High|Medium|Low' aderyn-report.md | head -c 20000 || true

      - name: Aderyn — GATE on high severity
        run: |
          set -euo pipefail
          # Aderyn groups findings under a "# High Issues" heading. Absence of
          # the heading is the pass condition; presence fails the build and the
          # report artifact carries the detail.
          if grep -qiE '^#+ +high issues' aderyn-report.md; then
            echo "::error::Aderyn reported high-severity findings — see the aderyn-report artifact"
            exit 1
          fi
          echo "no high-severity findings"

      - name: Upload Aderyn report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aderyn-report
          path: aderyn-report.md

  secrets:
    name: Secret scan (gitleaks, GATE)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret committed and later removed is still a
          # secret, and this repository is PUBLIC — a key that touches any
          # commit is compromised the moment it is pushed, not when it is
          # noticed. We have already had to rotate one RPC key.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          VER=$(curl -fsSL https://api.github.com/repos/gitleaks/gitleaks/releases/latest | grep -m1 '"tag_name"' | cut -d'"' -f4)
          # Asset naming is x64 on some releases and amd64 on others; try both
          # rather than pin a guess. `set -e` plus the version check below means
          # a silent miss cannot pass for a successful install.
          for arch in x64 amd64; do
            URL="https://github.com/gitleaks/gitleaks/releases/download/${VER}/gitleaks_${VER#v}_linux_${arch}.tar.gz"
            if curl -fsSL "$URL" -o "$RUNNER_TEMP/gitleaks.tgz"; then break; fi
          done
          # $HOME/bin, never /usr/local/bin: the runner's default user cannot
          # write there without sudo, and curl fails with exit 23 rather than
          # anything that names the cause.
          mkdir -p "$HOME/bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$HOME/bin" gitleaks
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/gitleaks" version

      - name: Scan the whole history
        run: gitleaks detect --source . --config .gitleaks.toml --redact --verbose --exit-code 1

      - name: Scan the working tree (uncommitted, catches it earlier)
        if: always()
        run: gitleaks detect --source . --no-git --config .gitleaks.toml --redact --exit-code 1

  solhint:
    name: Solhint (linter, report)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install & run Solhint
        run: |
          npm i -g solhint || true
          solhint 'src/**/*.sol' > solhint-report.txt 2>&1 || true
          echo "----- Solhint summary -----"
          cat solhint-report.txt || true
      - name: Upload Solhint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: solhint-report
          path: solhint-report.txt

  certora:
    name: Certora Prover (INV-20 effV4Fee fail-closed)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install certora-cli + solc 0.8.36
        run: |
          pip install certora-cli solc-select
          solc-select install 0.8.36
          solc-select use 0.8.36
          # Certora resolves the "solc0.8.36" name from PATH.
          ln -sf "$(command -v solc)" /usr/local/bin/solc0.8.36
      - name: Run Certora (skips gracefully until CERTORAKEY is set)
        env:
          CERTORAKEY: ${{ secrets.CERTORAKEY }}
        run: |
          if [ -z "$CERTORAKEY" ]; then
            echo "CERTORAKEY not set — Certora scaffold is ready; add the repo secret to run the proof."
            exit 0
          fi
          certoraRun certora/conf/effv4fee.conf
