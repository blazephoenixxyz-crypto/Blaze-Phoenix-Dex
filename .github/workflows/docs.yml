name: Contract reference (GitHub Pages)

# Publishes a browsable reference for every contract, generated from the
# natspec in the source. Run by hand (workflow_dispatch): on the pinned
# toolchain `forge doc --build` ran 22 minutes without output before the
# runner stopped it, so it stays off the push path until a run completes.
#
# Built in CI rather than committed, for one reason: documentation that is
# generated by hand goes stale silently, and stale documentation about a
# financial contract is worse than none. This way the published reference is
# the source of the commit it was built from, or it does not publish at all.
#
# It also cannot be built locally on the author's machine — the project pins
# solc 0.8.36 and Termux ships 0.8.35 — so CI is the only place this runs.
#
# Nothing here changes the licence. The source is BUSL-1.1: this makes it
# readable and auditable, which is what BUSL is for.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one midway, so the published site is
# always a complete build rather than a half-written one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # Pinned to v1.7.1, the last release whose `forge doc` builds an mdbook
      # (`--build`, output in docs-api/book). From v1.8.0 `forge doc` emits a
      # vocs scaffold instead and `--build` is gone, which broke this job.
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.7.1

      - name: Generate the reference from natspec
        run: forge doc --build --out docs-api

      - name: Upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs-api/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
