name: formal exploration (report-only, never gates)

# The symbolic checks that CANNOT decide, kept running where being unable to
# decide costs nothing.
#
# These route the solver through the 512-bit assembly mulDiv, which Halmos
# over-approximates (mulmod — a known limitation), so each TIMEOUTs at 60-189s
# instead of discharging. A TIMEOUT is not a counterexample: it is "could not
# determine". Its expected contribution to a merge decision is therefore exactly
# zero — while, living inside the gating job, its variance was large enough to
# cancel that job and take two real proofs down with it.
#
# A term with no expectation and real variance can only add noise to an
# estimator. So it moves out of the estimator, and keeps running here.
#
# This preserves the repo's own promotion rule rather than abandoning it: a
# check is promoted into the hard gate in ci.yml only after a report-only run
# has MEASURED it discharging cleanly. This workflow is where that measurement
# happens. If one of these ever discharges, promote it and delete it from here.
#
# Nothing in this file should ever block a merge. If you find yourself wanting
# to make it required, that means a check discharged — promote it instead.

on:
  schedule:
    # Weekly. These take minutes and prove nothing on any given run; the point
    # is to notice the day one of them starts discharging, not to watch it fail.
    - cron: '17 4 * * 1'
  workflow_dispatch:

jobs:
  explore:
    name: symbolic exploration (Core 512-bit mulDiv residue)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install Halmos
        run: pip install halmos

      - name: Symbolic checks (report-only)
        # test/formal/CoreFormalSpec.t.sol. The target properties are
        # hand-proven to hold: outV2's constant-product output is strictly
        # below rOut; outV3's early returns plus the sqrtNew < P guard bound
        # the quote; mulDiv-vs-exact matches by construction. What is missing
        # is a machine proof, not the argument.
        #
        # Bounded at the process rather than with timeout-minutes, which marks
        # a step CANCELLED — and GitHub propagates a cancellation to the job
        # even under continue-on-error, so the step would go red for doing
        # exactly what it is expected to do.
        run: timeout 1800 halmos --contract CoreFormalSpec -v || true

      - name: Note
        run: echo "Report-only. A TIMEOUT here is the expected outcome and gates nothing."
