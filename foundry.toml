optimizer_runs = 20000
via_ir = true
fs_permissions = [{ access = "read", path = "./" }, { access = "read-write", path = "./out/pc-trace" }]

# SMTChecker (CHC engine) — the lightest formal rung, run in the cloud by the
# glacier-abacus `smtchecker` job (this profile is what that job greps for).
# Report-only by nature: solc prints warnings for properties it cannot prove,
# it never fails the build. Targets the load-bearing arithmetic invariants
# (overflow/underflow, assertion, divByZero) across the Core assembly and the
# floor/median paths. Kept off the fast/release profiles because CHC solving
# is minutes-slow and must never gate normal CI.
[profile.smt]
src = "src"
test = "test"
out = "out-smt"
libs = ["lib"]
solc_version = "0.8.36"
evm_version = "cancun"
via_ir = true
[profile.smt.model_checker]
engine = "chc"
timeout = 120000            # ms per query; the cloud job caps wall time separately
targets = ["assert", "overflow", "underflow", "divByZero"]
contracts = { "src/BlazePhoenixCore.sol" = ["BlazePhoenixCore"] }
invariants = ["contract", "reentrancy"]
show_unproved = true

[rpc_endpoints]
# A BASE E O UNICO ENDPOINT COM ENDERECO PROPRIO, E A RAZAO ESTA MEDIDA.
#
# Sintoma: forks da Base contra a dRPC estouravam com `operation timed out` aos
# ~46s (o default do foundry), de forma ESTOCASTICA — o mesmo `setUp` passava
# numa corrida e falhava na seguinte.
#
# Tres explicacoes que eu dei e que a medicao REFUTOU, ficam escritas para
# ninguem as repetir:
#   1. "e o volume do varrimento"  -> um teste de 4 casos falha igual.
#   2. "e rate limit, falta throttle" -> com `--compute-units-per-second 25`
#      ficou PIOR: os pedidos fazem fila e a fila conta para o mesmo teto de 45s.
#   3. "e o bloco de arquivo"      -> `eth_getStorageAt` e `eth_getProof` no
#      bloco fixado respondem em 0,45s e 0,84s por `curl` directo.
# O endpoint serve depressa tudo o que o forge pede; o que falha e uma fraccao
# dos pedidos nunca voltar. Nao ha knob do forge que cure perda de pedidos.
#
# Trocar de endpoint foi a UNICA coisa que mexeu no resultado — ver a nota de
# sessao 133. O RPC oficial serve arquivo nos blocos que os testes fixam.
# ENDPOINT FIXO, sem variavel de ambiente, e a razao e o CI.
# As 28 guardas de skip dos testes de fork verificam `DRPC_KEY` — nao
# `BASE_RPC`. Pondo o endpoint numa variavel nova, um runner com `DRPC_KEY`
# definido (e sem `BASE_RPC`) entra nos testes e falha a resolver o fork, em vez
# de os saltar. O CI ficava VERMELHO por configuracao, nao por defeito.
# Este endpoint e publico e nao precisa de segredo, portanto a variavel nao
# comprava nada e custava a coerencia das guardas.
base = { endpoint = "https://mainnet.base.org", retries = 10, retry_backoff = 2000 }
mainnet = "https://lb.drpc.live/ethereum/${DRPC_KEY}"
optimism = "https://lb.drpc.live/optimism/${DRPC_KEY}"
# ARBITRUM — ARQUIVO NAO FIAVEL NO POOL DA dRPC. Os testes de fork FIXADOS
# (FactoryCensus, TokenSweep) morrem intermitentemente com
# "missing trie node <hash> ... state is not available", gas: 0, antes de
# qualquer assert. DIAGNOSTICO MEDIDO 2026-08-25, e cada hipotese refutada fica
# escrita para ninguem a repetir:
#   1. "a chave expirou"        -> era VERDADE, mas nao era ISTO: a chave antiga
#      respondia "Your key is deactivated"; com a chave nova o erro MUDOU de
#      volta para o trie node. Dois problemas sobrepostos, nao um.
#   2. "o bloco envelheceu fora da retencao" -> REFUTADO: `eth_getCode` no
#      MESMO contrato e no MESMO bloco fixado responde 5/5 por `curl`.
#   3. "e aquele bloco em concreto" -> REFUTADO: repinar para 498.008.832 deu
#      um trie hash DIFERENTE e a mesma falha.
#   O que resta, e bate com o padrao ja documentado para a Base acima: uma
#   FRACCAO dos backends do pool nao tem o estado de arquivo. Um `curl` (1
#   pedido) quase nunca lhes calha; o forge (centenas por teste) calha sempre.
#   Nao ha knob do forge para "o backend que me calhou nao tem o estado" — os
#   retries abaixo ajudam mas nao curam.
#   OP e RH no MESMO pool passam 3/3, portanto e especifico do arquivo do ARB.
#   PROXIMO PASSO quando isto voltar a bloquear: endpoint de arquivo proprio
#   para o ARB (o publico arb1.arbitrum.io NAO serve — retencao so a partir de
#   ~475,8M, medido). Ate la os testes de fork do ARB correm no CI (que tem
#   outro pool) e localmente sao flaky por INFRA, nunca por codigo.
arbitrum = { endpoint = "https://lb.drpc.live/arbitrum/${DRPC_KEY}", retries = 10, retry_backoff = 2000 }
robinhood = "https://lb.drpc.live/robinhood/${DRPC_KEY}"
# Unichain (chainId 130) — verificada ao vivo 2026-08-19 via dRPC.
unichain = "https://lb.drpc.live/unichain/${DRPC_KEY}"
