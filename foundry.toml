[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.36"
evm_version = "cancun"
bytecode_hash = "none"
optimizer = true
# via_ir stays ON: several functions (Solver._buildHop/_weights, Router.
# _execute) are written assuming the via-IR pipeline's stack-slot folding —
# turning it off would likely hit "stack too deep". What's dialed back is
# optimizer_runs: 999999 makes the Yul optimizer extremely memory-hungry, and
# on constrained hardware (this dev machine: ~11GB RAM+swap) it thrashed swap
# for 35+ minutes without finishing a single build and had to be killed. Use
# `[profile.release]` below (FOUNDRY_PROFILE=release) for the real
# gas-optimized build before an actual deploy; keep default fast for local
# dev/test iteration.
optimizer_runs = 300
via_ir = true
fs_permissions = [{ access = "read", path = "./" }, { access = "read-write", path = "./out/pc-trace" }]

[fuzz]
runs = 256
# Pinned: the anti-vacuity asserts (BP-04) require campaigns to actually
# settle; with a random seed each CI run, Router bytecode changes shift the
# test-derived addresses and unlucky walks settle 0 V4 swaps (flaky red on
# RouterAdversarialV4FromV1). Deterministic CI > seed lottery; the deep
# profile can run unseeded for diversity.
seed = "0xb1a2ef00"

[invariant]
# Kept modest on purpose: this repo's dev hardware runs under proot (heavy
# ptrace syscall-interception overhead per EVM call), so the stock Foundry
# defaults (runs=256, depth=500 => ~128k calls) are impractically slow here.
# Raise both on real CI/hardware for a deeper Monte Carlo search — e.g.
# `forge test --match-contract Invariant --invariant-runs 256 --invariant-depth 500`.
runs = 50
depth = 50
fail_on_revert = false

[profile.release]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.36"
evm_version = "cancun"
bytecode_hash = "none"
optimizer = true
# 999999 maxed runtime-gas bias but left the Router 246 B over the 24000
# margin once the native-ETH entry landed (measured: 24246 @ 999999);
# 5000 still measured 24107 (-107 short). 3000 bought the margin then, but
# the fa6c847 hardening pass outgrew it (Router 25,684 @ 3000).
# Remediation 2026-08-15: (1) heavyweight cold-path Core quote helpers went
# public -> deployed-library delegatecalls (see the EIP-170 note in
# BlazePhoenixCore.sol), (2) dead KIND_BALANCER_V2 branches removed,
# (3) runs re-measured: 3000->24,754 / 2000->24,679 / 1500->24,098 /
# 1000->23,829 / 800->23,184. 800 keeps every BlazePhoenix* contract under
# the CI's 24,000 guard with ~800 B of Router headroom for the next
# feature; re-measure the gas side with forge snapshot at the S3 testnet
# rehearsal. Next code lever if this dial is ever exhausted: Router/Core
# revert strings -> custom errors (~14 sites, est. 400-800 B; needs the two
# "BPC:" expectRevert pins in BlazePhoenixCore.t.sol updated with it).
optimizer_runs = 300
via_ir = true
fs_permissions = [{ access = "read", path = "./" }, { access = "read-write", path = "./out/pc-trace" }]

# SMTChecker (CHC engine) — the lightest formal rung, run in the cloud by the
# glacier-abacus `smtchecker` job (this profile is what that job greps for).
# Report-only by nature: solc prints warnings for properties it cannot prove,
# it never fails the build. Targets the load-bearing arithmetic invariants
# (overflow/underflow, assertion, divByZero) across the Core assembly and the
# floor/median paths. Kept off the fast/release profiles because CHC solving
# is minutes-slow and must never gate normal CI.
# ─── N-version lane (test/nversion): the release settings with ONE code-generation knob
# moved, so the same source yields a different binary to compare against the shipped one.
# Never used for a release; profile_parity.py compares default vs release only.
[profile.nver1]
src = "src"
test = "test"
out = "out-nver1"
libs = ["lib"]
solc_version = "0.8.36"
evm_version = "cancun"
bytecode_hash = "none"
optimizer = true
# 999999 maxed runtime-gas bias but left the Router 246 B over the 24000
# margin once the native-ETH entry landed (measured: 24246 @ 999999);
# 5000 still measured 24107 (-107 short). 3000 bought the margin then, but
# the fa6c847 hardening pass outgrew it (Router 25,684 @ 3000).
# Remediation 2026-08-15: (1) heavyweight cold-path Core quote helpers went
# public -> deployed-library delegatecalls (see the EIP-170 note in
# BlazePhoenixCore.sol), (2) dead KIND_BALANCER_V2 branches removed,
# (3) runs re-measured: 3000->24,754 / 2000->24,679 / 1500->24,098 /
# 1000->23,829 / 800->23,184. 800 keeps every BlazePhoenix* contract under
# the CI's 24,000 guard with ~800 B of Router headroom for the next
# feature; re-measure the gas side with forge snapshot at the S3 testnet
# rehearsal. Next code lever if this dial is ever exhausted: Router/Core
# revert strings -> custom errors (~14 sites, est. 400-800 B; needs the two
# "BPC:" expectRevert pins in BlazePhoenixCore.t.sol updated with it).
optimizer_runs = 1
via_ir = true
fs_permissions = [{ access = "read", path = "./" }, { access = "read-write", path = "./out/pc-trace" }]

